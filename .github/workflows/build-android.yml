
name: Build Alchemy Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Alchemy 1.0.0
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create temporary environment file
        shell: pwsh
        run: |
          @"
          deezerGatewayAPI = 'placeholder';
          deezerMobileKey = 'placeholder';
          lastFmApiKey = '';
          lastFmApiSecret = '';
          acrcloudHost = 'identify-eu-west-1.acrcloud.com';
          acrcloudSongApiKey = '';
          acrcloudSongApiSecret = '';
          acrcloudHumsApiKey = '';
          acrcloudHumsApiSecret = '';
          "@ | Set-Content -Path lib/.env -Encoding utf8

      - name: Prepare custom dependencies
        shell: pwsh
        run: ./run_build_runner.ps1

      - name: Get project dependencies
        run: flutter pub get
        
      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs
        
      - name: Build Android APKs
        run: flutter build apk --split-per-abi --release

      - name: Generate main project code
        shell: pwsh
        run: |
          dart run build_runner clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate scrobblenaut code
        shell: pwsh
        run: |
          Push-Location scrobblenaut
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run build_runner clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Alchemy-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
